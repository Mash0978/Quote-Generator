<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: white;
            text-align: center;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }
        .quote {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .author {
            font-style: italic;
            color: #bbbbbb;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="quote">Click the button to get a quote!</p>
        <p class="author"></p>
        <button class="btn" onclick="getQuote()">Get Quote</button>
    </div>

    <script>
        async function getQuote() {
            try {
                const response = await fetch("https://api.quotable.io/random");
                const data = await response.json();
                document.querySelector(".quote").innerText = `"${data.content}"`;
                document.querySelector(".author").innerText = `- ${data.author}`;
            } catch (error) {
                document.querySelector(".quote").innerText = "Failed to fetch quote. Try again!";
                document.querySelector(".author").innerText = "";
            }
        }
    </script>
</body>
</html>
